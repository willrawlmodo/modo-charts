<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><b>90%</b> of MISO capacity is self-supplied; the PRA clears the rest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.0/plotly.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      width: 100%;
      height: 100%;
    }
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #FFFFFF;
      color: #333333;
    }

    .chart-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding: 24px 28px 18px 28px;
    }

    /* === HEADER === */
    .chart-header {
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .chart-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 21px;
      font-weight: 400;
      line-height: 1.3;
      color: #000000;
      margin: 0;
    }
    .chart-title b {
      font-weight: 700;
    }
    .chart-subtitle {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: #5A6570;
      margin-top: 6px;
      line-height: 1.3;
    }

    /* === CHART === */
    #plotly-chart {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    /* === FOOTER === */
    .chart-footer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      padding-top: 12px;
      flex-shrink: 0;
      gap: 8px 24px;
    }
    .chart-source {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: #8E99A4;
      line-height: 1.4;
    }
    .chart-note {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: #8E99A4;
      line-height: 1.4;
    }
    .chart-footer-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .chart-wordmark {
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #000000;
      letter-spacing: 0.22em;
      white-space: nowrap;
      text-transform: uppercase;
      align-self: end;
      justify-self: end;
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <div class="chart-header">
      <div class="chart-title"><b>90%</b> of MISO capacity is self-supplied; the PRA clears the rest</div>
      <div class="chart-subtitle">PRA auction parameters for PY 2025-26</div>
    </div>

    <div id="plotly-chart"></div>

    <div class="chart-footer">
      <div class="chart-footer-left">
        <div class="chart-source">Source: MISO BPM-026, FERC, Modo Energy</div>
        <div class="chart-note">Note: CONE range reflects LRZ 10 ($321/MW-day) to LRZ 5 ($373/MW-day). RBDC approved under FERC docket ER23-2977, effective PY 2025-26.</div>
      </div>
      <div class="chart-wordmark">MODOENERGY</div>
    </div>
  </div>

  <script>
    var chartData = [{"type": "table", "columnwidth": [1.2, 3], "header": {"values": ["<b>Parameter</b>", "<b>Detail</b>"], "fill": {"color": "#F5F5F5"}, "font": {"color": "#000000", "family": "DM Sans", "size": 13}, "align": ["left", "left"], "height": 40, "line": {"color": "#E8E8E8", "width": 1}}, "cells": {"values": [["Planning Resource Auction (PRA)", "Frequency and timing", "Zones", "Demand curve", "CONE (PY 2025-26)", "Seasonal construct", "ESR eligibility"], ["~90% of capacity is self-supplied; the PRA clears the residual.", "Annual, late March. Results posted ~late April. Planning year starts June 1.", "10 Local Resource Zones: North/Central (LRZ 1-7), South (LRZ 8-10)", "Vertical through PY 2024-25. RBDC (downward-sloping) from PY 2025-26.", "$321 \u2013 $373/MW-day by zone ($117k \u2013 $136k/MW-yr)", "4 equal seasons: Summer (Jun-Aug), Fall (Sep-Nov), Winter (Dec-Feb), Spring (Mar-May)", "Electric Storage Resources since Sep 2022. 4-hour batteries receive 95% capacity credit."]], "fill": {"color": [["#FFFFFF", "#FFFFFF", "#FFFFFF", "#FFFFFF", "#FFFFFF", "#FFFFFF", "#FFFFFF"], ["#FFFFFF", "#FFFFFF", "#FFFFFF", "#FFFFFF", "#FFFFFF", "#FFFFFF", "#FFFFFF"]]}, "font": {"color": "#000000", "family": "DM Sans", "size": 12}, "align": ["left", "left"], "height": 36, "line": {"color": "#E8E8E8", "width": 1}}}];
    var chartLayout = {"template": {"layout": {"colorway": ["#6F5FE5", "#E03F61", "#E59C58", "#467EE4", "#FFE300", "#27AC60", "#A074FB", "#F7C191", "#6CDD9C", "#C5AAFD"], "font": {"color": "#5A6570", "family": "DM Sans, sans-serif", "size": 13}, "paper_bgcolor": "rgba(0,0,0,0)", "plot_bgcolor": "rgba(0,0,0,0)"}}, "margin": {"l": 0, "r": 0, "t": 0, "b": 0}, "height": 294};
    var chartConfig = {
      displayModeBar: false,
      responsive: true,
      staticPlot: false
    };
    Plotly.newPlot('plotly-chart', chartData, chartLayout, chartConfig);

    window.addEventListener('resize', function() {
      Plotly.Plots.resize('plotly-chart');
    });

    // Report actual content height to parent for iframe auto-sizing.
    // Parent listens for 'modo-chart-height' messages and resizes the iframe.
    function reportHeight() {
      var h = document.querySelector('.chart-wrapper').scrollHeight;
      window.parent.postMessage({ type: 'modo-chart-height', height: h }, '*');
    }
    // Report after Plotly renders and on resize
    setTimeout(reportHeight, 200);
    setTimeout(reportHeight, 600);
    window.addEventListener('resize', reportHeight);
  </script>
</body>
</html>
