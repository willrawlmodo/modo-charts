<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battery storage has reached 27% of ERAS capacity in Cycle 3, up from under 2% in Cycle 1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.0/plotly.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html {
      width: 100%;
      height: 100%;
    }
    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #FFFFFF;
      color: #333333;
    }

    .chart-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      padding: 24px 28px 18px 28px;
    }

    /* === HEADER === */
    .chart-header {
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .chart-title {
      font-family: 'DM Sans', sans-serif;
      font-size: 21px;
      font-weight: 400;
      line-height: 1.3;
      color: #000000;
      margin: 0;
    }
    .chart-title b {
      font-weight: 700;
    }
    .chart-subtitle {
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 400;
      color: #5A6570;
      margin-top: 6px;
      line-height: 1.3;
    }

    /* === CHART === */
    #plotly-chart {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    /* === FOOTER === */
    .chart-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-top: 12px;
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 8px 24px;
    }
    .chart-source {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: #8E99A4;
      line-height: 1.4;
    }
    .chart-note {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: #8E99A4;
      line-height: 1.4;
    }
    .chart-footer-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .chart-wordmark {
      font-family: 'DM Sans', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #000000;
      letter-spacing: 0.22em;
      white-space: nowrap;
      flex-shrink: 0;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <div class="chart-header">
      <div class="chart-title">Battery energy storage has grown from <b>under 2%</b> to <b>27%</b> of MISO ERAS capacity across three cycles</div>
      <div class="chart-subtitle">ERAS capacity by fuel type and cycle (GW)</div>
    </div>

    <div id="plotly-chart"></div>

    <div class="chart-footer">
      <div class="chart-footer-left">
        <div class="chart-source">Source: MISO ERAS Interconnection Requests (March 2026), Modo Energy</div>
        <div class="chart-note">Note: Pending applications not yet assigned to a study cycle.</div>
      </div>
      <div class="chart-wordmark">MODOENERGY</div>
    </div>
  </div>

  <script>
    var chartData = [
      {
        "name": "Natural Gas",
        "x": ["Cycle 1", "Cycle 2", "Cycle 3", "Pending"],
        "y": [4.308, 4.845, 6.425, 6.089],
        "text": ["82%", "71%", "73%", "75%"],
        "textposition": "inside",
        "textfont": {"color": "#000000", "family": "DM Sans", "size": 13},
        "hovertemplate": "<b>Natural Gas</b><br>%{x}: %{y:,.1f} GW (%{customdata}%)<extra></extra>",
        "customdata": [82, 71, 73, 75],
        "marker": {"color": "#E59C58", "line": {"width": 2, "color": "#000000"}},
        "type": "bar"
      },
      {
        "name": "Battery Energy Storage",
        "x": ["Cycle 1", "Cycle 2", "Cycle 3", "Pending"],
        "y": [0.091, 0.898, 2.340, 1.160],
        "text": ["", "13%", "27%", "14%"],
        "textposition": "inside",
        "textfont": {"color": "#000000", "family": "DM Sans", "size": 13},
        "hovertemplate": "<b>Battery Energy Storage</b><br>%{x}: %{y:,.1f} GW (%{customdata}%)<extra></extra>",
        "customdata": [2, 13, 27, 14],
        "marker": {"color": "#A074FB", "line": {"width": 2, "color": "#000000"}},
        "type": "bar"
      },
      {
        "name": "Solar",
        "x": ["Cycle 1", "Cycle 2", "Cycle 3", "Pending"],
        "y": [0.525, 0.499, 0.0, 0.916],
        "text": ["10%", "", "", "11%"],
        "textposition": "inside",
        "textfont": {"color": "#000000", "family": "DM Sans", "size": 13},
        "hovertemplate": "<b>Solar</b><br>%{x}: %{y:,.1f} GW (%{customdata}%)<extra></extra>",
        "customdata": [10, 7, 0, 11],
        "marker": {"color": "#FFE300", "line": {"width": 2, "color": "#000000"}},
        "type": "bar"
      },
      {
        "name": "Wind",
        "x": ["Cycle 1", "Cycle 2", "Cycle 3", "Pending"],
        "y": [0.360, 0.619, 0.0, 0.0],
        "text": ["", "", "", ""],
        "textposition": "none",
        "hovertemplate": "<b>Wind</b><br>%{x}: %{y:,.1f} GW (%{customdata}%)<extra></extra>",
        "customdata": [7, 9, 0, 0],
        "marker": {"color": "#81B1FE", "line": {"width": 2, "color": "#000000"}},
        "type": "bar"
      }
    ];
    var chartLayout = {
      "template": {
        "layout": {
          "colorway": ["#6F5FE5", "#E03F61", "#E59C58", "#81B1FE", "#FFE300", "#27AC60", "#A074FB", "#F7C191", "#6CDD9C", "#C5AAFD"],
          "font": {"color": "#5A6570", "family": "DM Sans, sans-serif", "size": 13},
          "hoverlabel": {"bgcolor": "#333333", "bordercolor": "#333333", "font": {"color": "#FFFFFF", "family": "DM Sans, sans-serif", "size": 13}},
          "hovermode": "x unified",
          "legend": {"bgcolor": "rgba(0,0,0,0)", "borderwidth": 0, "font": {"color": "#5A6570", "size": 12}, "itemsizing": "constant", "orientation": "h", "traceorder": "normal", "x": 0, "xanchor": "left", "y": 1.01, "yanchor": "bottom"},
          "margin": {"b": 40, "l": 8, "pad": 4, "r": 20, "t": 10},
          "paper_bgcolor": "rgba(0,0,0,0)",
          "plot_bgcolor": "rgba(0,0,0,0)",
          "xaxis": {"automargin": true, "showgrid": false, "showline": false, "tickcolor": "rgba(0,0,0,0)", "tickfont": {"color": "#5A6570", "size": 13}, "ticks": ""},
          "yaxis": {"automargin": true, "gridcolor": "#F9F9F9", "gridwidth": 0.25, "separatethousands": true, "showgrid": true, "showline": false, "tickcolor": "rgba(0,0,0,0)", "tickfont": {"color": "#5A6570", "size": 13}, "ticks": "", "zeroline": false}
        }
      },
      "barmode": "stack",
      "xaxis": {"type": "category"},
      "yaxis": {"rangemode": "tozero"},
      "legend": {"orientation": "h", "yanchor": "bottom", "y": 1.01, "xanchor": "left", "x": 0}
    };
    var chartConfig = {
      displayModeBar: false,
      responsive: true,
      staticPlot: false
    };
    Plotly.newPlot('plotly-chart', chartData, chartLayout, chartConfig).then(function() {
      document.querySelectorAll('.legendpoints path').forEach(function(el) {
        el.style.strokeWidth = '0';
      });
      // SVG filter for white glow behind labels
      var svg = document.querySelector('#plotly-chart .main-svg');
      if (svg) {
        var defs = svg.querySelector('defs') || svg.insertBefore(document.createElementNS('http://www.w3.org/2000/svg','defs'), svg.firstChild);
        var filter = document.createElementNS('http://www.w3.org/2000/svg','filter');
        filter.setAttribute('id','white-glow');
        filter.setAttribute('x','-20%');
        filter.setAttribute('y','-20%');
        filter.setAttribute('width','140%');
        filter.setAttribute('height','140%');
        filter.innerHTML = '<feFlood flood-color="#FFFFFF" flood-opacity="1" result="flood"/>' +
          '<feComposite in="flood" in2="SourceGraphic" operator="in" result="mask"/>' +
          '<feGaussianBlur in="mask" stdDeviation="3" result="blur"/>' +
          '<feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>';
        defs.appendChild(filter);
      }
      document.querySelectorAll('.bartext-inside').forEach(function(el) {
        el.setAttribute('filter','url(#white-glow)');
      });
    });

    window.addEventListener('resize', function() {
      Plotly.Plots.resize('plotly-chart');
    });

    function reportHeight() {
      var h = document.querySelector('.chart-wrapper').scrollHeight;
      window.parent.postMessage({ type: 'modo-chart-height', height: h }, '*');
    }
    setTimeout(reportHeight, 200);
    setTimeout(reportHeight, 600);
    window.addEventListener('resize', reportHeight);
  </script>
</body>
</html>
